[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bomiq"
dynamic = ["version"]
description = "Local BOM analysis and part intelligence engine for electronics BOMs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "TAJZ" }]
keywords = ["bom", "electronics", "digikey", "mouser", "octopart", "obsolescence",
            "procurement", "eda", "supply-chain"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Manufacturing",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

# The engine, CLI, server and UI need nothing beyond the standard library.
dependencies = []

[project.optional-dependencies]
# Faster and broader, but never required.
extras = [
  "openpyxl>=3.1",      # richer .xlsx reading (a built-in reader is used otherwise)
  "xlrd>=2.0.1",        # legacy .xls
  "rapidfuzz>=3.0",     # ~50x faster fuzzy matching
  "keyring>=24.0",      # store API keys in the OS credential store
]
desktop = ["pywebview>=4.4"]
build = ["pyinstaller>=6.0"]
dev = ["pyinstaller>=6.0", "openpyxl>=3.1", "xlrd>=2.0.1", "rapidfuzz>=3.0",
       "keyring>=24.0"]

[project.scripts]
bomiq = "bomiq.cli:main"

[project.gui-scripts]
bomiq-app = "bomiq.desktop:main"

[tool.setuptools]
packages = [
  "bomiq", "bomiq.util", "bomiq.core", "bomiq.ingest", "bomiq.providers",
  "bomiq.analysis", "bomiq.export", "bomiq.server",
]

[tool.setuptools.package-data]
"bomiq.server" = ["ui/*.html", "ui/*.css", "ui/*.js"]

[tool.setuptools.dynamic]
version = { attr = "bomiq.version.__version__" }
