# Render Blueprint — free web service for Schemata.
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. In the Render dashboard: "New +" -> "Blueprint" -> pick the schemata repo.
#   3. Render builds, starts `uvicorn` and gives a public URL.
#
# Open https://<your-app>.onrender.com/?token=<SCHEMATA_ACCESS_TOKEN>
# (the token is generated automatically and shown in the service's Environment).
# Add live-source API keys as env vars (ARROW_API_KEY, DIGIKEY_CLIENT_ID, ...)
# in the Render dashboard Environment tab, then "Manual Deploy".
#
# Note: the free plan has an ephemeral disk — the SQLite database and cached
# reports reset on restart/redeploy, and the service sleeps after ~15 min idle
# (the first request after sleep takes ~1 min cold start).

services:
  - type: web
    name: schemata
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -e "."
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: SCHEMATA_ACCESS_TOKEN
        generateValue: true